<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">

<title>炮製學闖關問答</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--tx:#1d2733;--mu:#5d6b7a;--pr:#2e75b6;--bd:#cfdbe8;--ok:#1d7a34;--okb:#e6f5ea;--no:#b32d2d;--nob:#fbeaea;--gd:#b87400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--tx:#e6edf4;--mu:#9aa9b8;--pr:#6aaee8;--bd:#2c3a49;--ok:#6fd48a;--okb:#16301f;--no:#ff8d8d;--nob:#3a1b1b;--gd:#f2b84b;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 "Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:14px}
.w{max-width:680px;margin:0 auto}h1{font-size:22px;margin:4px 0}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.b{display:block;width:100%;background:var(--pr);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;cursor:pointer;margin-top:8px}.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0;font-size:15.5px;cursor:pointer}
.opt.pk{border-color:var(--pr);background:var(--bd)}
.hud{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .1s linear}
.tg{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--bd);color:var(--tx)}
.d3{color:var(--no)}.d1{color:var(--ok)}.d2{color:var(--gd)}
.pop{text-align:center;font-size:22px;font-weight:700;padding:26px 0}
.ok{color:var(--ok)}.no{color:var(--no)}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:14.5px}.rv.bad{background:var(--nob);margin:0 -14px;padding:10px 14px}
.big{font-size:38px;font-weight:700;color:var(--gd)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"c": 1, "s": "我國現存第一部藥學專著為下列何者？", "o": ["《神農本草經》", "《本草綱目》", "《雷公炮炙論》", "《炮炙大法》"], "a": 0, "e": "《神農本草經》為第一部藥學專著；《雷公炮炙論》才是第一部炮製專著。", "d": 1}, {"c": 1, "s": "我國第一部炮製專著為下列何者？", "o": ["《雷公炮炙論》（雷斅）", "《修事指南》", "《新修本草》", "《神農本草經》"], "a": 0, "e": "雷斅撰《雷公炮炙論》三卷，為第一部炮製專著。", "d": 1}, {"c": 1, "s": "「炒炭存性」的要求，是在張仲景「燒灰存性」基礎上，由何者明確提出？", "o": ["清代趙學敏《本草綱目拾遺》、唐容川《血證論》", "漢代《神農本草經》", "唐代《新修本草》", "明代李時珍《本草綱目》"], "a": 0, "e": "清代炭藥的炮製與應用有相當大的發展，並明確提出「炒炭存性」。", "d": 2}, {"c": 1, "s": "關於中藥炮製發展時期的敘述，何者「有誤」？", "o": ["現代（1912年以後）是炮製振興、發展時期", "春秋戰國至宋代是炮製技術的起始和形成時期", "金元、明時期是炮製技術的起始和形成時期", "清代是炮製品種和技術的擴大應用時期"], "a": 2, "e": "金元、明時期是<b>炮製理論</b>的形成時期；技術起始形成期是春秋戰國至宋代。", "d": 3}, {"c": 1, "s": "將前人炮製方法歸納為「雷公炮製十七法」者為何人／何書？", "o": ["唐代《新修本草》", "明代繆希雍《炮炙大法》", "南朝雷斅《雷公炮炙論》", "清代張仲巖《修事指南》"], "a": 1, "e": "繆希雍《炮炙大法》收載439種藥物，並歸納十七法。", "d": 2}, {"c": 1, "s": "《神農本草經》序錄中對有毒藥物炮製機理的描述為：", "o": ["「生熟有定，須燒煉炮製」", "「勿令犯火，勿令犯鐵」", "「若有毒宜制，可用相畏相殺者」", "「有毒者一律不可入藥」"], "a": 2, "e": "生熟有定為張仲景；勿令犯火為雷公炮炙論。", "d": 2}, {"c": 1, "s": "《雷公炮炙論》提到莨菪、吳茱萸（含生物鹼）用醋製，其科學道理為：", "o": ["醋使鞣質沉澱", "醋使揮發油增加", "醋使生物鹼成鹽，增加水中溶解度", "醋使生物鹼分解成毒性小的化合物"], "a": 2, "e": "另：茵陳勿令犯火；白芍用竹刀、知母沒食子勿犯鐵器。", "d": 2}, {"c": 1, "s": "李時珍《本草綱目》載藥1892種，其中記有「修治」專目者為：", "o": ["330味", "52味", "232味", "439味"], "a": 0, "e": "439種為炮炙大法；232種為修事指南。", "d": 3}, {"c": 1, "s": "《黃帝內經》「秫米半夏湯」中的「治半夏」，說明當時已注意到：", "o": ["有毒藥物的炮製", "藥物的產地加工", "炭藥的製備", "藥物的貯藏"], "a": 0, "e": "血餘炭（角發、燔治）為最早的炭藥。", "d": 2}, {"c": 1, "s": "下列何者屬於中藥炮製的研究方法？", "o": ["只用文獻學一種方法", "文獻學、實驗藥理學、化學、臨床療效觀察、多學科結合", "只用化學成分分析", "僅憑經驗口傳"], "a": 1, "e": "文獻學是基礎；成分不清時用實驗藥理學比較活性。", "d": 2}, {"c": 2, "s": "下列何者屬於「相資為製」？", "o": ["枳實破氣作用過強，用麩炒緩和", "用辛熱升提的酒炮製苦寒沉降的大黃", "用鹹寒的鹽水炮製苦寒的知母、黃柏，增強滋陰降火", "用生薑炮製半夏、南星以降低毒性"], "a": 2, "e": "相資為製＝用藥性相似的輔料增強藥效（相須、相使）。酒製大黃為相反；薑製半夏為相畏；麩炒枳實為相惡。", "d": 2}, {"c": 2, "s": "「用生薑炮製半夏、南星以降低毒性」屬於傳統製藥原則中的何者？", "o": ["相畏（相殺）為製", "相資為製", "相反為製", "相喜為製"], "a": 0, "e": "相畏（相殺）為製＝以輔料製約另一藥的毒副作用。", "d": 2}, {"c": 2, "s": "「入肝經藥多用醋製，如醋炙柴胡、醋炙延胡索」屬於何種製藥原則？", "o": ["相資為製", "相惡為製", "相喜為製", "相反為製"], "a": 2, "e": "相喜為製＝利用五味入五臟的相喜關係，引藥入經增效。", "d": 2}, {"c": 2, "s": "下列何者屬於「製其形」？", "o": ["以輔料炮製使某些味增強或減弱", "王不留行炒爆花", "穿山甲砂炒至酥泡，利於煎出", "增加藥物香氣，以達起脾開胃"], "a": 1, "e": "王不留行炒爆花改變外形＝製其形；砂炒酥泡＝製其質；增香氣＝製其性；調整五味＝製其味。", "d": 2}, {"c": 2, "s": "關於炮製對升降沉浮影響的敘述，何者「有誤」？", "o": ["黃連、黃芩酒製後增強上行趨勢，屬升者益升", "黃柏、杜仲以鹽製後，增強上行趨勢", "砂仁經鹽炙後可下行溫腎，屬生升熟降", "大黃酒炒可引藥上行，屬生降熟升"], "a": 1, "e": "黃柏、杜仲鹽製後引藥入腎、<b>增強下行</b>（降者益降）。", "d": 3}, {"c": 2, "s": "下列輔料與引藥入經的配對，何者正確？", "o": ["鹽製入腎", "蜜製入肝", "鹽製入肺", "醋製入脾"], "a": 0, "e": "醋製入肝、蜜製入脾、鹽製入腎。", "d": 1}, {"c": 2, "s": "關於炮製與毒性的敘述，何者正確？", "o": ["巴豆須以水飛法去毒", "有毒藥物只能用單一炮製方法去毒", "去毒應以徹底去除一切成分為原則", "炮製有毒藥物須去毒與存效並重，否則可能毒去效失"], "a": 3, "e": "去毒常用淨製、水泡漂、水飛、加熱、加輔料、去油製霜，可單獨或合併；巴豆為去油製霜；須兼顧效用。", "d": 2}, {"c": 2, "s": "關於湯劑與中成藥對飲片炮製要求的敘述，何者「有誤」？", "o": ["全鹿丸中的杜仲需用鹽水炒", "中成藥全部可直接以生品飲片為原料，不需依法炮製", "附桂理中丸中黨參、甘草要求蜜酒炙", "十全大補丸中不能用生地代替熟地"], "a": 1, "e": "中成藥也不能都用生品為原料，仍需按處方要求「依法炮製」。", "d": 3}, {"c": 2, "s": "「寒者益寒、熱者益熱」以增強藥性的炮製方法，稱為：", "o": ["相惡為製", "製其質", "從製", "反製"], "a": 2, "e": "從製＝增強中藥性味（如酒炒當歸增強活血通經）；反製＝緩和或改變性味。", "d": 2}, {"c": 2, "s": "關於乾薑與炮薑的敘述，何者正確？", "o": ["乾薑性燥、作用猛、力速，適脾胃寒邪偏盛；炮薑作用緩和持久，適脾胃虛寒", "乾薑與炮薑作用完全相同", "乾薑適用於脾胃虛寒、炮薑適用於寒邪偏盛", "炮薑性燥、作用猛、力速"], "a": 0, "e": "乾薑→炮薑：溫而不燥，作用持久。", "d": 2}, {"c": 2, "s": "關於升降沉浮的敘述，何者正確？", "o": ["沉降藥能上行向外，有發表作用", "升浮藥能上行向外，有升陽、發表、散寒、催吐等作用", "沉降藥主治病位在表", "升浮藥多性寒涼、味酸苦鹹"], "a": 1, "e": "沉降：下行向裡，清熱瀉下利水收斂平喘；性溫熱味辛甘多升浮。", "d": 2}, {"c": 2, "s": "生地甘寒（清熱涼血）製成熟地後轉為甘溫（滋陰補血），此種改變性味屬於：", "o": ["相惡為製", "從製", "生寒熟溫（反製範疇）", "製其形"], "a": 2, "e": "亦有生溫熟涼。", "d": 2}, {"c": 2, "s": "川烏、草烏蒸或煮製，屬炮製去毒的哪一類方法？", "o": ["淨製", "加熱", "去油製霜", "水飛"], "a": 1, "e": "朱砂雄黃水飛；巴豆製霜；甘遂芫花醋製。", "d": 1}, {"c": 2, "s": "黃連苦寒，以辛熱吳茱萸炮製以緩和其苦寒，稱為：", "o": ["製其質", "相畏為製", "寒者益寒（從製）", "以熱制寒（反製）"], "a": 3, "e": "", "d": 1}, {"c": 3, "s": "「逢子必炒」的炮製依據為下列何者？", "o": ["種子炒後可改變升降沉浮", "種子炒後揮發油含量增加", "種子有硬殼不易煎出，炒後表皮爆裂，有效成分便於煎出", "種子炒後毒性增強"], "a": 2, "e": "《醫宗粹言》：凡藥用子者俱要炒過，入煎方得味出。", "d": 2}, {"c": 3, "s": "麻黃莖能發汗、根能止汗，故須分開入藥，此屬炮製目的中的哪一項？", "o": ["提高藥物淨度，確保用藥品質（分開藥用部位）", "增強藥物療效", "降低藥物毒性", "有利於貯藏"], "a": 0, "e": "同株不同藥用部位作用不同，須區分入藥。", "d": 2}, {"c": 3, "s": "柏子仁經去油製霜後，可消除何種副作用？", "o": ["燥烈傷陰", "腥臭味", "咽喉刺激", "滑腸致瀉"], "a": 3, "e": "柏子仁用於寧心安神時需避免滑腸致瀉，去油製霜可消除。", "d": 1}, {"c": 3, "s": "關於炮製有利貯藏的敘述，何者「有誤」？", "o": ["桑螵蛸蒸、炒可殺死蟲卵防止孵化", "藥物乾燥處理使含水量降低，避免霉爛", "黃芩、杏仁等含苷類藥物加熱，可活化酶的活性以利久貯", "蘇子、萊菔子加熱可終止種子發芽"], "a": 2, "e": "含苷類藥物加熱是<b>破壞酶的活性</b>，避免有效成分被酶解損失。", "d": 3}, {"c": 3, "s": "自然銅、磁石、代赭石、牡蠣、石決明、穿山甲須煅、煅淬或砂燙，主要屬於哪一項炮製目的？", "o": ["改變藥物性能", "提高藥物淨度", "矯臭矯味", "便於調劑和製劑"], "a": 3, "e": "質地堅硬難粉碎，炮製使酥脆易粉碎且利有效成分煎出。", "d": 2}, {"c": 3, "s": "以酶促、發酵促進化學成分轉化，屬於何種炮製轉化？", "o": ["生物炮製轉化", "化學炮製轉化", "傳統炮製轉化", "物理炮製轉化"], "a": 0, "e": "傳統：火製水製水火共製；化學：酸製鹼製；生物：酶促、發酵。", "d": 1}, {"c": 3, "s": "蒲黃生用與炒用的差別為：", "o": ["生用降毒，炒用增毒", "生用止血，炒用活血化瘀", "生用活血化瘀，炒用止血", "生炒作用相同"], "a": 2, "e": "屬改變或緩和藥物性能；另「補湯宜用熟，瀉藥不嫌生」。", "d": 2}, {"c": 3, "s": "款冬花、紫菀蜜炙後，增強潤肺止咳，是因蜂蜜：", "o": ["能使生物鹼成鹽", "能破壞酶活性", "能吸附油脂", "甘緩益脾、潤肺止咳，與藥物協同"], "a": 3, "e": "", "d": 1}, {"c": 3, "s": "酒製烏梢蛇、紫河車，主要目的為：", "o": ["終止發芽", "降低毒性", "矯臭矯味", "便於粉碎"], "a": 2, "e": "另：麩炒殭蠶、醋製乳香沒藥。", "d": 1}, {"c": 3, "s": "麻黃生用有「煩」、「汗出不可止」的副作用，古人處理方式為：", "o": ["先製霜", "先砂燙", "先炒炭", "先煮數沸"], "a": 3, "e": "屬降低毒副作用。", "d": 2}, {"c": 4, "s": "藥學史上第一位總結炮製方法的醫藥家為：", "o": ["陶弘景", "雷斅", "陳嘉謨", "繆希雍"], "a": 0, "e": "陶弘景於《本草經集注‧序》把炮製方法與藥用部位結合記述。", "d": 1}, {"c": 4, "s": "明代陳嘉謨《本草蒙筌》的三類分類法中，屬於「水火共製」的是：", "o": ["漬、泡", "蒸、煮", "煅、炮", "炙、炒"], "a": 1, "e": "火製：煅炮炙炒；水製：漬泡洗；水火共製：蒸、煮。", "d": 2}, {"c": 4, "s": "雷公炮製十七法中的「煨」是指：", "o": ["將藥物直接置於火上烘乾", "將藥物置沸水中微煮搓去皮", "將藥物浸潤後置密閉容器中潤軟", "以濕潤麵粉或紙漿包裹藥物，埋於熱火灰中至包裹物呈焦黃"], "a": 3, "e": "煨肉豆蔻、煨木香；沸水微煮＝爁（燀）；烘乾＝煿；密閉潤軟＝伏。", "d": 2}, {"c": 4, "s": "「水飛爐甘石」在雷公炮製十七法中屬於：", "o": ["鎊", "飛", "煉", "伏"], "a": 1, "e": "飛＝藥物細粉與水共研，分取上層懸浮液得極細粉。", "d": 1}, {"c": 4, "s": "雷公炮製十七法中的「爁」，一般稱為：", "o": ["燀（藥物置沸水中微煮，能搓去皮為度）", "露", "煅", "煨"], "a": 0, "e": "例：燀杏仁。", "d": 1}, {"c": 4, "s": "下列何者屬於「動物類固體輔料」？", "o": ["米泔水", "稻米", "白礬", "蛤粉"], "a": 3, "e": "蛤粉為動物類固體輔料；白礬為礦物類；稻米為食物類；米泔水為特殊液體輔料。", "d": 1}, {"c": 4, "s": "近代依炮製工藝分類的「三大類」為：", "o": ["炒、炙、煅", "修治、水製、火製", "火製、水製、水火共製", "淨製、切製、炮炙"], "a": 3, "e": "火製水製水火共製為明代陳嘉謨三類；修治水製火製水火共製其他製法為五類。", "d": 1}, {"c": 4, "s": "炮製教材多採用的分類法為：", "o": ["只依藥用部位", "以輔料為綱、工藝為目", "只依性味", "以工藝為綱、輔料為目"], "a": 3, "e": "如炙法再分酒炙、醋炙、薑炙、蜜炙。", "d": 1}, {"c": 4, "s": "下列何者屬「藥汁液體輔料」？", "o": ["米泔水、膽汁", "酒、醋", "甘草汁、吳茱萸汁、黑豆汁", "滑石粉、河砂"], "a": 2, "e": "米泔水、膽汁、麻油、酥油、羊脂油、鱉血為特殊液體輔料。", "d": 1}, {"c": 4, "s": "雷公炮製十七法中「度」是指：", "o": ["將藥物削成薄片", "將藥物擊碎", "將藥物曝曬", "將藥物切成片、段、塊等適度規格"], "a": 3, "e": "擊碎＝摋；削薄片＝鎊。", "d": 1}, {"c": 5, "s": "一般炮製品的水分含量宜控制在：", "o": ["15%～20%", "1%～3%", "25%～30%", "7%～13%"], "a": 3, "e": "水分過多易生蟲霉變，過少（如膠類）易龜裂。", "d": 3}, {"c": 5, "s": "關於炮製品灰分的敘述，何者「有誤」？", "o": ["可測總灰分與酸不溶性灰分評價品質與淨度", "灰分低於正常值，應考慮是否有偽品或劣質品", "砂炒、土炒、蛤粉炒品完全不會使灰分高於生品", "灰分超過正常值，可能有無機鹽或外源性雜質"], "a": 2, "e": "砂炒、蛤粉炒、土炒、滑石粉炒難免附少量無機物，可能使灰分高於生品，須訂合理限量。", "d": 3}, {"c": 5, "s": "下列何者在紫外光下呈金黃色螢光？", "o": ["牡丹皮粉末", "黃連、酒黃連、薑黃連、萸黃連", "秦皮的水溶液", "白芍粉末"], "a": 1, "e": "秦皮水溶液為淡藍色螢光；黃連及其炮製品呈金黃色螢光。", "d": 1}, {"c": 5, "s": "關於昇華物鑑別的敘述，何者「有誤」？", "o": ["酒大黃、醋大黃粉末可見淺黃色菱狀針晶或羽狀結晶", "牡丹皮炭粉末微量昇華後，仍可見長柱形或針狀羽狀簇晶", "須用放大鏡或顯微鏡觀察晶形與色澤", "牡丹皮粉末昇華可見針狀或羽狀簇晶"], "a": 1, "e": "牡丹皮炭已<b>不再</b>有此昇華現象。", "d": 3}, {"c": 5, "s": "台灣中藥典(6005)夾雜物檢查法中，粗粒或體積較大之生藥，應取樣品多少檢查？", "o": ["1 g", "50 g", "500 g", "5 kg"], "a": 2, "e": "一般採樣25～500 g，粗粒或體積大者取500 g，用鑷子剔出夾雜物稱重計算百分率。", "d": 3}, {"c": 5, "s": "下列何者屬於炮製品「有毒成分」限量指標？", "o": ["重金屬含量", "砷鹽含量", "農藥殘留量", "以上皆是"], "a": 3, "e": "有毒成分限量包括毒副作用成分、重金屬、砷鹽、農藥殘留。", "d": 1}, {"c": 5, "s": "醋製延胡索與生品相比，何項指標明顯較高？", "o": ["水溶性浸出物", "灰分", "夾雜物", "水分"], "a": 0, "e": "醋使游離生物鹼成鹽，水溶性浸出物遠高於生品。", "d": 1}, {"c": 5, "s": "含結晶水的礦物藥與乾燥空氣接觸，日久逐漸脫水成粉末狀態，稱為：", "o": ["潮解溶化", "風化", "泛油", "粘黏"], "a": 1, "e": "風化＝失水變粉（芒硝、硼砂）；潮解溶化＝吸水變液。", "d": 2}, {"c": 5, "s": "下列何者最容易因含油脂多、受熱而發生泛油？", "o": ["鮮生地、鮮石斛", "芒硝、硼砂", "杏仁、桃仁、柏子仁", "乳香、沒藥"], "a": 2, "e": "芒硝、硼砂易風化；鮮藥易腐爛；乳香、沒藥易粘黏。", "d": 1}, {"c": 5, "s": "熔點較低的固體樹脂類藥物（如乳香、沒藥、阿魏）受潮後粘連成塊，稱為：", "o": ["泛油", "風化", "粘黏", "揮發"], "a": 2, "e": "阿膠、鹿角膠、龜板膠也易粘黏。", "d": 2}, {"c": 5, "s": "藥物成分在何種溫度條件下較為穩定？", "o": ["50℃以上", "30～35℃", "常溫 15～20℃", "40～45℃"], "a": 2, "e": "溫度升高則物理、化學、生物變化均加速。", "d": 3}, {"c": 5, "s": "黴菌最易萌發繁殖的環境為：", "o": ["室溫 20～35℃，相對濕度 75%以上", "室溫 40～50℃，相對濕度 30%以下", "室溫 5～10℃，相對濕度 75%以上", "室溫 20～35℃，相對濕度 30%以下"], "a": 0, "e": "蟲害則以18～35℃、含水量13%以上、相對濕度70%以上最適。", "d": 3}, {"c": 5, "s": "下列何者屬於中藥貯藏方法中的「對抗同貯法」？", "o": ["以缸、罈、罐等容器密閉存放", "保持庫房清潔並消毒", "蘄蛇（白花蛇）與花椒或大蒜瓣同貯", "利用生石灰吸收潮濕空氣中水分"], "a": 2, "e": "生石灰屬防濕養護；容器密閉屬密封貯藏；清潔消毒屬清潔養護。", "d": 2}, {"c": 5, "s": "關於貯藏新技術的敘述，何者正確？", "o": ["氣幕防潮是以輻射殺菌", "氣調貯藏以降氧、充氮氣（或充二氧化碳）達到殺蟲防霉", "低溫冷藏是利用輻射線殺蟲", "中藥揮發油薰蒸以石灰與木炭為最佳"], "a": 1, "e": "氣幕＝裝於庫房門防冷熱空氣交換；揮發油薰蒸以蓽澄茄、丁香效果最佳。", "d": 2}, {"c": 5, "s": "下列何者因日光照射，色素遭破壞而易變色、變脆、散瓣？", "o": ["阿膠、鹿角膠", "芒硝、硼砂", "玫瑰花、月季花、紅花、蜜炙款冬花", "乳香、沒藥"], "a": 2, "e": "日光是使藥物變色、氣味散失、揮發、風化、泛油的因素之一；芒硝硼砂易風化，乳香沒藥阿膠易粘黏。", "d": 2}, {"c": 5, "s": "下列何者為炮製品色澤要求的意義？", "o": ["色澤與品質無關", "白芍變紅、紅花變黃表示內在成分已變化", "炮製品一律要求變黑", "色澤只影響外觀"], "a": 1, "e": "熟地要求烏黑發亮；蜜炙甘草要求老黃色。", "d": 2}, {"c": 5, "s": "關於炮製品氣味的要求，何者正確？", "o": ["酒製品應帶鹹味", "醋製品應帶醋香，鹽製品應帶鹹味，麩炒品應帶麥麩焦香", "麩炒品應帶醋味", "輔料炮製品須完全無輔料氣味"], "a": 1, "e": "", "d": 2}, {"c": 5, "s": "哪一類炮製品含水量過少反而影響品質，易龜裂？", "o": ["膠類藥物（阿膠、鹿角膠）", "根莖類", "種子類", "花類"], "a": 0, "e": "", "d": 1}, {"c": 5, "s": "薄層層析(TLC)用於炮製品鑑別時，應注意：", "o": ["吸附劑與展開劑的選擇，並以標準品、對照品並行", "可完全照搬生藥條件", "輔料不會影響層析行為", "不需對照品"], "a": 0, "e": "", "d": 2}, {"c": 5, "s": "飲片貯存時，易因含澱粉、糖、脂肪、蛋白質而發生的變異為：", "o": ["粘黏", "風化", "潮解", "蟲蛀"], "a": 3, "e": "發霉則為受潮後黴菌繁殖。", "d": 2}, {"c": 5, "s": "關於蟲害環境的敘述，何者正確？", "o": ["溫度0～5℃最適繁殖", "溫度18～35℃、含水量13%以上、相對濕度70%以上最適繁殖", "相對濕度30%以下最適繁殖", "含水量5%以下最適繁殖"], "a": 1, "e": "", "d": 3}, {"c": 6, "s": "下列何者淨選時需「去木心」？", "o": ["牡丹皮", "山楂", "枳殼", "人參"], "a": 0, "e": "牡丹皮、地骨皮、白鮮皮、五加皮、巴戟天去木心；山楂去核；枳殼去瓤；人參去蘆。", "d": 1}, {"c": 6, "s": "下列何者屬於「去蘆」（除去根頭、殘莖、葉基）？", "o": ["斑蝥", "枳殼", "山茱萸", "桔梗"], "a": 3, "e": "人參、黨參、防風、玄參、桔梗、牛膝需去蘆；山茱萸去核；枳殼去瓤；斑蝥去頭足翅。", "d": 1}, {"c": 6, "s": "下列何者屬於「去瓤」？", "o": ["訶子", "枳殼", "龍眼肉", "烏梅"], "a": 1, "e": "枳殼瓤無治療作用，不含揮發油；烏梅、訶子、龍眼肉為去核。", "d": 1}, {"c": 6, "s": "鹿茸去毛，傳統上多用何法？", "o": ["撞去毛", "刷去毛", "燙去毛", "刮去毛"], "a": 3, "e": "刷：枇杷葉、石韋；燙：骨碎補、狗脊；撞：香附；挖：金櫻子。", "d": 1}, {"c": 6, "s": "下列何者需「去頭足翅」？", "o": ["龜甲、鱉甲", "厚朴", "斑蝥、紅娘子", "夏枯草"], "a": 2, "e": "龜甲、鱉甲為去殘肉；厚朴為去粗皮；夏枯草去枝梗。", "d": 1}, {"c": 6, "s": "關於蓮子的敘述，何者「有誤」？", "o": ["蓮子肉能補脾澀精", "蓮子心與蓮子肉作用相同，不需分開入藥", "去心可分離藥用部位", "蓮子心能清心熱"], "a": 1, "e": "蓮子心、肉作用不同，須分別入藥。", "d": 3}, {"c": 6, "s": "下列何者為利用藥物與雜質「品質不同」，借風力除去雜質的方法？", "o": ["挑選", "水選", "風選", "篩選"], "a": 2, "e": "篩選依體積大小；水選以水洗漂。", "d": 2}, {"c": 6, "s": "麻黃碾成絨狀，主要目的為：", "o": ["矯臭矯味", "增強發汗", "降低毒性", "緩和發汗作用，適用於老年、兒童、體弱者"], "a": 3, "e": "艾葉製絨則便於製艾條艾柱。", "d": 1}, {"c": 6, "s": "朱砂拌、青黛拌屬於何種加工？", "o": ["揉搓", "製絨", "碾搗", "拌衣"], "a": 3, "e": "拌衣＝藥物表面用水濕潤使輔料黏附。", "d": 1}, {"c": 6, "s": "關於去皮殼的敘述，何者正確？", "o": ["知母不可去皮", "厚朴的粗皮有效成分遠高於內皮", "桔梗帶皮必有明顯毒性", "苦杏仁、桃仁等種子類可用燀法去皮"], "a": 3, "e": "厚朴內皮有效成分遠高於粗皮，故去粗皮。", "d": 2}, {"c": 6, "s": "關於厚朴去皮的敘述，何者正確？", "o": ["粗皮有效成分最高", "皮類藥材一律不去皮", "去粗皮，因內皮有效成分遠高於粗皮", "去內皮，保留粗皮"], "a": 2, "e": "", "d": 2}, {"c": 6, "s": "訶子需去核，其依據為：", "o": ["核的鞣質含量高於果肉", "核有劇毒", "核的鞣質僅約4%，果肉約26%", "核含揮發油"], "a": 2, "e": "", "d": 1}, {"c": 6, "s": "龜甲、鱉甲、豹骨等動物類藥物須：", "o": ["去心", "去蘆", "去殘肉、筋膜、骨塞", "去頭足翅"], "a": 2, "e": "", "d": 1}, {"c": 6, "s": "柴胡只以根入藥的依據為：", "o": ["莖葉毒性大", "根含有藥理活性皂苷，莖葉不含", "莖葉含鞣質", "根含揮發油最多"], "a": 1, "e": "", "d": 1}, {"c": 7, "s": "依「質堅宜薄、質鬆宜厚」原則，下列何者宜切薄片？", "o": ["山藥", "當歸", "茯苓", "甘草"], "a": 1, "e": "質地緻密堅實宜薄片（烏藥、檳榔、當歸、白芍、木通）；鬆泡粉性大宜厚片（山藥、天花粉、茯苓、甘草、黃耆）。", "d": 1}, {"c": 7, "s": "「將藥材放入大量清水，每日換水2～3次，漂去有毒成分、鹽分及腥臭異味」稱為：", "o": ["淋潤軟化", "洗潤軟化", "漂潤軟化", "泡潤軟化"], "a": 2, "e": "泡潤則中間不換水。", "d": 2}, {"c": 7, "s": "當歸、玄參、牛膝將藥材攤放於濕潤而墊有篾席的土地上自然吸潮回潤，屬於：", "o": ["露潤（吸濕回潤）", "淋潤", "浸潤", "伏潤"], "a": 0, "e": "伏潤＝缸罈密閉悶潤；浸潤＝水盡藥透。", "d": 2}, {"c": 7, "s": "依規格，「厚片」的厚度通常為：", "o": ["2～4 mm", "5～10 mm", "1～2 mm", "0.5 mm以下"], "a": 0, "e": "極薄片0.5mm以下；薄片1～2mm；厚片2～4mm。", "d": 3}, {"c": 7, "s": "馬蹄片多用於下列何者？", "o": ["甘草、黃耆", "桂枝、桑枝", "雞血藤、山藥", "大黃、何首烏"], "a": 2, "e": "瓜子片：桂枝、桑枝；柳葉片：甘草、黃耆；馬蹄片：雞血藤、山藥；直片：大黃等。", "d": 1}, {"c": 7, "s": "下列何種切藥機不適宜切製全草類藥物？", "o": ["剁刀式切藥機", "手工中藥剪", "旋轉式切藥機", "片刀"], "a": 2, "e": "剁刀式一般不適宜顆粒狀藥材；旋轉式不宜全草類。", "d": 1}, {"c": 7, "s": "天南星、半夏、川烏、草烏的切製途徑屬於：", "o": ["趁鮮切製", "軟化切製", "不需切製", "炮製後切製"], "a": 3, "e": "毒劇藥生品不能直接入藥，經複雜炮製符合安全後再切片乾燥。", "d": 1}, {"c": 7, "s": "飲片切製的「細而不粉」，其意義為：", "o": ["增加與溶媒接觸面積，並避免細粉煎煮時糊化粘鍋", "使飲片外觀美觀", "飲片愈細愈好，可磨成粉", "切成極薄片即可"], "a": 0, "e": "", "d": 2}, {"c": 7, "s": "「順刀片」是指：", "o": ["腰斷後縱切的片", "與刀垂直切出的橫片", "藥材長軸與切藥刀成平行方向切出的片", "與刀成角度的斜片"], "a": 2, "e": "垂直為頂刀片；縱切為直片；斜切為斜片。", "d": 2}, {"c": 7, "s": "關於北剪與南剪的敘述，何者正確？", "o": ["北剪刀柄斜30度", "兩者無差別", "南剪為機器切藥", "北剪刀柄垂直、以下槌動作；南剪刀柄斜30度、似拉桿移動"], "a": 3, "e": "", "d": 2}, {"c": 7, "s": "陰乾法特別適用於：", "o": ["礦物類", "芳香性、色澤鮮豔或日照易變色及含黏油的飲片", "需快速乾燥者", "所有飲片"], "a": 1, "e": "如白芍、檳榔；天冬、玄參、玉竹。", "d": 1}, {"c": 8, "s": "炒製前先預熱鍋具，其目的之一是：", "o": ["防止種子類藥物炒成「僵子」（炒啞）", "延長藥物停留時間", "增加輔料用量", "使藥物含水量增加"], "a": 0, "e": "預熱便於掌握溫度、縮短停留時間。", "d": 2}, {"c": 8, "s": "炒製翻動時要求「亮鍋底」，目的為：", "o": ["增加火力", "避免少量藥物停留鍋底而枯焦", "減少翻炒次數", "使輔料沉底"], "a": 1, "e": "每次下鏟都要露鍋底。", "d": 1}, {"c": 8, "s": "判定炒黃程度的四種經驗法中，被認為「最關鍵」的是：", "o": ["聽爆聲", "對比看", "聞香氣", "看斷面（呈淡黃色）"], "a": 3, "e": "若外表加深但斷面不變，可能外焦內生。", "d": 2}, {"c": 8, "s": "關於清炒目的的敘述，何者正確？", "o": ["種子類炒後不易煎出有效成分", "萊菔子、瓜蔞仁生品有悶臭氣，炒後氣香可糾其弊", "牽牛子炒後毒性增強", "槐花、地榆炒炭後止血作用減弱"], "a": 1, "e": "牽牛子炒後降低毒性；炒炭可增強止血。", "d": 2}, {"c": 8, "s": "關於決明子的敘述，何者「有誤」？", "o": ["藥用部位為乾燥根莖", "藥用部位為成熟種子", "主要活性成分為蒽醌類", "炒後水煎出率增加，保肝作用強於生品"], "a": 0, "e": "決明子為豆科成熟種子。", "d": 3}, {"c": 8, "s": "酸棗仁常見的誤用品基原為：", "o": ["滇刺棗（Ziziphus jujuba Lam.）", "酸橙", "決明", "山楂"], "a": 0, "e": "酸棗仁為鼠李科酸棗種子。", "d": 1}, {"c": 8, "s": "關於酸棗仁炒製的敘述，何者正確？", "o": ["鎮靜安眠有效部位為脂溶性成分", "炒後種皮開裂易粉碎煎出，並可殺酶保苷", "炒後總黃酮與皂苷含量降低", "炒焦、炒黑品之提取物含量高於生品"], "a": 1, "e": "微炒或炒黃水、醚提物高於生品；炒焦炒黑低於生品；有效部位為水溶性成分。", "d": 2}, {"c": 8, "s": "焦山楂的作用特點為：", "o": ["酸味增加，刺激胃黏膜", "長於活血化瘀、降濁化脂", "酸味減弱、苦味增加，長於消食止瀉", "主要用於胃腸出血"], "a": 2, "e": "生山楂活血化瘀降脂；山楂炭止瀉止血。", "d": 2}, {"c": 8, "s": "槐花炒炭後，其成分與作用的變化為：", "o": ["鞣質完全消失", "蘆丁（rutin）降低，槲皮素與鞣質升高，涼血止血力增強", "蘆丁升高，槲皮素降低", "涼血作用最強、止血作用最弱"], "a": 1, "e": "槐米止血物質被認為是鞣質，由蘆丁水解為槲皮素→兒茶素→縮合成鞣質。", "d": 2}, {"c": 8, "s": "麩炒時，一般每100 kg藥物用麥麩約：", "o": ["10～15 kg", "80～100 kg", "1～2 kg", "40～50 kg"], "a": 0, "e": "麩炒用中火，先撒麥麩起煙再投藥。", "d": 3}, {"c": 8, "s": "關於麩炒操作的敘述，何者「有誤」？", "o": ["一般用中火並保持火力均勻", "先將藥物放入鍋內，再撒入麥麩同時加熱", "麩炒藥物要求乾燥，以免粘附焦化麥麩", "麥麩要均勻撒布熱鍋中，待起煙投藥"], "a": 1, "e": "正確順序：鍋燒熱→撒麩至起煙→投藥。", "d": 3}, {"c": 8, "s": "蒼朮「燥性」的物質基礎與下列何者有關？", "o": ["鞣質", "揮發油（蒼朮醇、蒼朮酮）", "多醣類", "生物鹼"], "a": 1, "e": "過量揮發油有副作用；麩炒與米泔水製效果佳。", "d": 1}, {"c": 8, "s": "麩炒枳殼的臨床特點為：", "o": ["緩和燥性與酸性，宜用於年老體弱而氣滯者", "主要用於降低毒性", "作用較生品更峻烈", "增加揮發油含量"], "a": 0, "e": "枳殼麩炒後揮發油含量減少，刺激減小。", "d": 2}, {"c": 8, "s": "米炒藥物時，每100 kg藥物約用米：", "o": ["100 kg", "2 kg", "20 kg", "60 kg"], "a": 2, "e": "米以糯米為佳；先撒浸濕的米貼鍋，炒至米冒煙投藥。", "d": 3}, {"c": 8, "s": "斑蝥素開始昇華的溫度約為：", "o": ["300℃", "200℃", "110℃", "50℃"], "a": 2, "e": "甲酸沸點101℃；米炒鍋溫120～140℃使斑蝥素昇華、甲酸揮發而降毒。", "d": 3}, {"c": 8, "s": "土炒時，每100 kg藥物一般用灶心土：", "o": ["1～3 kg", "60～70 kg", "25～30 kg", "100 kg以上"], "a": 2, "e": "灶心土粉用中火加熱至呈靈活狀態再投藥。", "d": 3}, {"c": 8, "s": "白朮炮製的理論「減酮減燥，增酯增效」，其化學基礎為：", "o": ["蒼朮酮氧化生成白朮內酯", "皂苷水解成苷元", "蒼朮醇聚合成鞣質", "白朮內酯還原成蒼朮酮"], "a": 0, "e": "炒製後揮發油約損失15%，健脾作用增強。", "d": 2}, {"c": 8, "s": "關於砂炒的敘述，何者正確？", "o": ["砂用量以不掩蓋藥物為度", "砂炒適用於質地柔軟的藥材", "砂炒用文火、溫度低", "炒過毒性藥物（如馬錢子）的砂，不可再炒其他藥物"], "a": 3, "e": "砂炒火力強、溫度高，適用質地堅硬藥材；砂量以能掩蓋藥物為度。", "d": 2}, {"c": 8, "s": "馬錢子砂燙降毒的化學基礎為：", "o": ["番木鼈鹼含量增加", "番木鼈鹼縮合為鞣質", "馬錢子鹼被還原為生物鹼鹽", "番木鼈鹼與馬錢子鹼發生氧化及醚鍵開環，轉為異構物及氮氧化物"], "a": 3, "e": "異番木鼈鹼等含量增加，使毒性降低。", "d": 2}, {"c": 8, "s": "蛤粉炒最適合炮製下列何類藥物？", "o": ["種子類", "礦物類", "膠類藥物（如阿膠、鹿角膠）", "根莖類"], "a": 2, "e": "蛤粉火力較弱、傳熱較砂慢，使藥物緩慢受熱。", "d": 1}, {"c": 8, "s": "蒲黃炒阿膠的作用特點為：", "o": ["止血安絡力強", "益肺潤燥", "燥濕健脾", "滋陰補血"], "a": 0, "e": "蛤粉炒阿膠善益肺潤燥；阿膠丁長於滋陰補血。", "d": 1}, {"c": 8, "s": "關於水蛭炮製的敘述，何者「有誤」？", "o": ["滑石粉炒後水蛭素含量高於生品", "生水蛭質地柔韌不易粉碎", "滑石粉炒可降低毒性、使質地酥脆易粉碎", "水蛭屬環節動物門，身體有環節與吸盤"], "a": 0, "e": "生水蛭的水蛭素與浸出物含量高於製品。", "d": 3}, {"c": 8, "s": "「炒炭存性」的意義為：", "o": ["藥物雖大部分炭化，仍保留固有性味並不同程度保存原有化學成分", "炭化後原有性味完全改變", "炒炭只需炒至表面微黃", "藥物須完全炭化成灰"], "a": 0, "e": "炒炭：中火或武火炒至表面焦黑、內部焦黃或焦褐，噴水滅盡火星。", "d": 2}, {"c": 8, "s": "「火候」的意義為：", "o": ["使用的鍋具種類", "輔料的用量", "火的大小或溫度高低", "藥物炮製的時間和程度"], "a": 3, "e": "火力＝火的大小（強弱）。", "d": 1}, {"c": 8, "s": "炒焦多具何種功效？", "o": ["安神", "健脾消導（如神麴、山楂、穀芽、麥芽）", "止血", "潤腸"], "a": 1, "e": "", "d": 1}, {"c": 8, "s": "蒼朮性狀特徵「朱砂點」與「起霜」分別指：", "o": ["黑色斑點；紅色粉末", "橙黃或棕紅色油點；析出白毛狀結晶", "白色環紋；黑色結晶", "綠色油點；黃色結晶"], "a": 1, "e": "", "d": 2}, {"c": 8, "s": "白朮土炒後的作用特點為：", "o": ["降血壓為主", "健脾止瀉勝，多用於脾虛泄瀉", "利水消腫最強", "主要用於發汗"], "a": 1, "e": "麩炒偏緩和燥性、增強健脾。", "d": 1}, {"c": 8, "s": "斑蝥的特殊用藥注意為：", "o": ["只可炒炭", "無毒，孕婦可用", "有大毒，孕婦禁用", "只可內服"], "a": 2, "e": "", "d": 1}, {"c": 8, "s": "滑石粉炒適用於何類藥物？", "o": ["種子類藥物", "韌性較大的動物類藥物，如水蛭", "膠類藥物", "質地堅硬的礦物"], "a": 1, "e": "膠類用蛤粉炒；質硬藥用砂炒。", "d": 1}, {"c": 8, "s": "槐花與槐米的關係為：", "o": ["槐花＝果實；槐米＝種子", "兩者皆為種子", "槐花＝根；槐米＝葉", "槐花＝花；槐米＝花蕾"], "a": 3, "e": "槐米中蘆丁含量約為槐花的2倍多。", "d": 1}, {"c": 9, "s": "關於炙法與加輔料炒的比較，何者「有誤」？", "o": ["炙法使用液體輔料，要求輔料滲入藥物內部", "加輔料炒製後輔料多棄去", "炙法一般用文火，以炒至乾為宜", "炙法使用固體輔料，輔料主要起中間傳熱作用"], "a": 3, "e": "傳熱、固體、棄去是加輔料炒的特點。", "d": 3}, {"c": 9, "s": "炮製用黃酒的乙醇含量約為：", "o": ["15%～20%", "40%～50%", "75%～95%", "2%～5%"], "a": 0, "e": "黃酒相對密度約0.98，含糖類、酯類、氨基酸、礦物質。", "d": 3}, {"c": 9, "s": "酒炙法中「先炒藥後加酒」，主要用於下列何者？", "o": ["含黏液質多的藥物，如車前子", "質地疏鬆的藥物，如五靈脂", "所有藥物", "質地堅實的根及根莖，如黃連"], "a": 1, "e": "先拌酒後炒適用堅實根莖類（黃連、川芎、白芍）。", "d": 2}, {"c": 9, "s": "酒大黃的製法，每100 kg大黃片用黃酒約：", "o": ["30 kg", "60 kg", "1 kg", "10 kg"], "a": 3, "e": "熟大黃（酒燉）用黃酒約30 kg。", "d": 3}, {"c": 9, "s": "關於大黃炭的敘述，何者「有誤」？", "o": ["瀉下作用極微", "具有止血作用", "番瀉苷已不存在", "仍保有峻烈的瀉下作用"], "a": 3, "e": "大黃炭結合型大黃酸大量破壞、番瀉苷消失，瀉下極微。", "d": 3}, {"c": 9, "s": "炮製含鞣質藥物時，使用竹刀、銅刀、木盆、砂鍋的主要原因為：", "o": ["鞣質遇鐵會生成黑綠色鞣質鐵鹽沉澱", "鞣質不耐低溫", "鞣質遇銅會爆炸", "避免鞣質被還原"], "a": 0, "e": "鞣質易溶熱水、易氧化成鞣紅，並能耐高溫。", "d": 2}, {"c": 9, "s": "炮製用醋，其總酸量不得低於：", "o": ["3.5%", "20%", "0.5%", "10%"], "a": 0, "e": "醋酸約占4～6%；醋精（化學合成）不能使用。", "d": 3}, {"c": 9, "s": "樹脂類、動物糞便類藥物醋炙時，應採用：", "o": ["先以醋拌勻悶潤再炒", "先炒藥後噴醋", "直接以醋浸泡24小時", "只用醋蒸不炒"], "a": 1, "e": "先醋拌會粘結成塊或鬆散，受熱不均、炒不透或易炒焦。", "d": 1}, {"c": 9, "s": "醋炙延胡索可增強止痛，其原理主要為：", "o": ["醋使揮發油增加", "醋使生物鹼完全破壞", "醋使游離生物鹼成鹽，水煎液中總生物鹼含量增加", "醋使鞣質增加"], "a": 2, "e": "醋炒加熱卻使季胺鹼下降，故有粗顆粒拌醋悶潤與酒石酸法的改良。", "d": 2}, {"c": 9, "s": "製備薑汁時，薑汁與生薑的比例以多少為宜？", "o": ["10：1", "1：1", "5：1", "1：10"], "a": 1, "e": "水用量不宜過多；藥物拌薑汁後須充分悶潤至吸盡再文火炒乾。", "d": 3}, {"c": 9, "s": "炮薑的製法為：", "o": ["生薑搗汁後濃縮", "乾薑以鹽水拌炒", "乾薑以羊脂油炒", "淨河砂武火加熱，投入乾薑片炒至鼓起、表面棕褐色，篩去砂"], "a": 3, "e": "薑炭為武火炒至表面黑、內部棕褐；薑炭止血作用強於炮薑。", "d": 2}, {"c": 9, "s": "煉蜜的終點溫度約為：", "o": ["116～118℃（含水量10%～13%）", "80～90℃", "50～60℃", "150～160℃"], "a": 0, "e": "滿鍋起魚眼泡，手撚有黏性，兩指間尚無長白絲。", "d": 3}, {"c": 9, "s": "車前子、知母等含黏液質多的藥物鹽炙時，應：", "o": ["先以鹽水拌潤再炒", "以鹽水浸泡過夜", "用大火直接炒至焦黑", "先炒去部分水分，再噴灑鹽水"], "a": 3, "e": "遇水易發粘、鹽水不易滲入、易粘鍋；鹽水量約為食鹽的4～5倍。", "d": 2}, {"c": 9, "s": "關於厚朴薑製的敘述，何者正確？", "o": ["薑製可消除對咽喉的刺激性，並增強寬中和胃功效，薑製品厚朴酚含量最高", "生品對咽喉無刺激，薑製後才有", "薑炙品抑制小鼠胃排空", "薑製後厚朴酚含量低於生品"], "a": 0, "e": "薑炙品促進胃排空強於生品。", "d": 2}, {"c": 9, "s": "蜜炙甘草後，甘草酸含量降低，主要是因為：", "o": ["甘草酸水解為18β-甘草次酸", "甘草酸被氧化為揮發油", "甘草酸聚合為鞣質", "甘草酸被蜂蜜完全吸收"], "a": 0, "e": "炙甘草甘溫，補脾和胃、益氣復脈。", "d": 2}, {"c": 9, "s": "鹽炙杜仲的作用特點為：", "o": ["作用上行清上焦", "直達下焦，溫而不燥，增強補肝腎作用", "性寒瀉火", "主要用於祛風濕堅筋骨"], "a": 1, "e": "生杜仲偏燥，用於腎虛兼風濕腰痛。", "d": 2}, {"c": 9, "s": "淫羊藿以羊脂油炙後，其功效特點為：", "o": ["主要增強祛風濕", "降低毒性", "增強溫腎補陽、強壯筋骨", "增強清熱涼血"], "a": 2, "e": "羊脂油性熱味甘，溫散寒邪、補腎助陽；炮製品使血漿睾酮升高。", "d": 1}, {"c": 9, "s": "蜜炙麻黃的敘述，何者正確？", "o": ["揮發油增加，發汗作用增強", "麻黃鹼被完全破壞", "蜜炙後不再有止咳平喘作用", "揮發油減少1/2以上，麻黃鹼含量相對提高，更適用於喘咳"], "a": 3, "e": "麻黃揮發油為發汗成分，麻黃鹼為平喘成分。", "d": 2}, {"c": 9, "s": "酒炙「引藥上行」的原理，常用於哪類藥物？", "o": ["苦寒沉降藥，如大黃、黃連、黃柏", "礦物類", "芳香揮發類", "辛熱升浮藥"], "a": 0, "e": "酒能緩和寒性、免傷脾胃，並借升提之力清上焦。", "d": 1}, {"c": 9, "s": "醋炙降低毒性、緩和峻下作用，主要適用於：", "o": ["當歸、川芎", "大戟、甘遂、芫花、商陸等峻下逐水藥", "黃耆、甘草", "烏梢蛇、蘄蛇"], "a": 1, "e": "", "d": 1}, {"c": 9, "s": "吳茱萸汁製黃連的效果為：", "o": ["降低揮發油", "增強苦寒之性", "寒而不滯，清氣分濕熱、散肝膽鬱火", "使黃連升浮"], "a": 2, "e": "", "d": 1}, {"c": 9, "s": "米泔水炮製蒼朮、白朮，主要是利用其：", "o": ["吸附油脂，降低辛燥，增強補脾和中", "殺菌防腐", "使生物鹼成鹽", "增強發汗"], "a": 0, "e": "", "d": 1}, {"c": 9, "s": "盛裝蜂蜜   clearInterval(tm);const wb=ld("pz3_wrong",{}),ids=Object.keys(wb),best=ld("pz3_best",0);
  $.innerHTML=`<h1>🎮 炮製學闖關問答</h1><div class="mu">${Q.length} 題・限時作答・整回合結束後才公布詳解　最高分：<b>${best}</b></div>
  <div class="card"><b>計分規則</b><div class="mu" style="line-height:1.8">答對＝100 × 難度倍率＋速度加成＋連擊加成<br>
  <span class="d1">★簡單</span> ×1・20秒・答錯 −50　<span class="d2">★★中等</span> ×1.5・30秒・答錯 −30　<span class="d3">★★★困難</span> ×2・40秒・答錯 −20<br>逾時視為答錯；連續答對 2 題起，每多一連擊 +10（最多 +50）</div></div>
  <div class="card"><b>選擇範圍</b><div class="chips" id="ch"></div>
  <b>題數</b><div class="chips" id="ct"></div>
  <button class="b" id="go">開始闖關</button>
  <button class="b g" id="rv" ${ids.length?"":"disabled style='opacity:.4'"}>錯題複習（${ids.length} 題待複習）</button>
  <div class="mu" style="margin-top:8px">錯題複習：答錯的題目要在之後「連續答對 2 次」才會移出錯題本。</div></div>`;
  const c=document.getElementById("ch");
  for(let k=1;k<=9;k++){const n=Q.filter(q=>q.c==k).length,b=document.createElement("button");b.className="chip"+(sel.has(k)?" on":"");b.textContent=`${CH[k]}（${n}）`;b.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);home()};c.appendChild(b)}
  const t=document.getElementById("ct");
  [10,15,20,30].forEach(n=>{const b=document.createElement("button");b.className="chip"+(cnt==n?" on":"");b.textContent=n+" 題";b.onclick=()=>{cnt=n;home()};t.appendChild(b)});
  document.getElementById("go").onclick=()=>{const p=Q.map((q,i)=>i).filter(i=>!sel.size||sel.has(Q[i].c));start(shuf(p).slice(0,cnt),false)};
  document.getElementById("rv").onclick=()=>{if(ids.length)start(shuf(ids.map(Number)).slice(0,20),true)}}
function start(p,rev){R={p,i:0,sc:0,ok:0,st:0,log:[],rev};ask()}
function ask(){
  if(R.i>=R.p.length)return end();
  const id=R.p[R.i],q=Q[id],d=DF[q.d];let left=d.t*1000,done=false;
  $.innerHTML=`<div class="hud"><span>${R.rev?"錯題複習":"闖關"} ${R.i+1}/${R.p.length}</span><span>🏆 ${R.sc}　🔥${R.st}</span></div>
  <div class="bar"><i id="tb" style="width:100%"></i></div>
  <div class="card"><div class="mu"><span class="tg ${"d"+q.d}">${star(q.d)} ${d.n} ×${d.m}</span> ${CH[q.c]}　⏱ <span id="tl">${d.t}</span>s</div>
  <div style="font-weight:600;margin:8px 0">${q.s}</div><div id="os"></div></div>`;
  const os=document.getElementById("os");
  q.o.forEach((t,j)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`${L[j]}. ${t}`;b.onclick=()=>fin(j);os.appendChild(b)});
  function fin(j){
    if(done)return;done=true;clearInterval(tm);
    const good=j===q.a;let pts;
    if(good){const sp=Math.floor(left/(d.t*1000)*50);R.st++;pts=Math.round((100+sp)*d.m)+Math.min(Math.max(R.st-1,0),5)*10;R.ok++}
    else{R.st=0;pts=d.p}
    R.sc+=pts;R.log.push({id,j,good,pts,to:j<0});
    const wb=ld("pz3_wrong",{});
    if(good){if(wb[id]){wb[id]--;if(wb[id]<=0)delete wb[id]}}else wb[id]=2;
    sv("pz3_wrong",wb);
    $.innerHTML=`<div class="hud"><span>${R.i+1}/${R.p.length}</span><span>🏆 ${R.sc}</span></div><div class="card pop ${good?"ok":"no"}">${j<0?"⏰ 時間到":good?"✔ 答對":"✘ 答錯"}<br>${pts>0?"+":""}${pts}</div><div class="mu" style="text-align:center">詳解將於本回合結束後公布</div>`;
    setTimeout(()=>{R.i++;ask()},900)}
  tm=setInterval(()=>{left-=100;document.getElementById("tb").style.width=Math.max(left/(d.t*1000)*100,0)+"%";document.getElementById("tl").textContent=Math.ceil(Math.max(left,0)/1000);if(left<=0)fin(-1)},100)}
function end(){
  const n=R.p.length,acc=Math.round(R.ok/n*100),best=ld("pz3_best",0);if(R.sc>best&&!R.rev)sv("pz3_best",R.sc);
  const rk=acc>=90?"炮製大師":acc>=75?"飲片達人":acc>=60?"炮製學徒":"繼續加油";
  $.innerHTML=`<h1>回合結束</h1><div class="card" style="text-align:center"><div class="big">${R.sc}</div><div>稱號：<b>${rk}</b>　答對 ${R.ok}/${n}（${acc}%）</div>${R.sc>best&&!R.rev?"<div class='ok'>🎉 刷新最高分！</div>":""}</div>
  <div class="chips"><button class="chip on" id="fa">全部詳解</button><button class="chip" id="fw">只看錯題</button></div><div id="lg"></div>
  ${R.log.some(x=>!x.good)?`<button class="b" id="rt">立即重做本回合錯題</button>`:""}<button class="b g" id="hm">回首頁</button>`;
  const draw=w=>{document.getElementById("lg").innerHTML=R.log.map((x,k)=>({x,k})).filter(o=>!w||!o.x.good).map(({x,k})=>{const q=Q[x.id];return `<div class="rv ${x.good?"":"bad"}"><b>${k+1}.</b> <span class="tg">${star(q.d)}</span> ${q.s}<br><span class="${x.good?"ok":"no"}">你的答案：${x.j<0?"（逾時）":L[x.j]+". "+q.o[x.j]}　${x.pts>0?"+":""}${x.pts}</span><br><span class="ok">正解：${L[q.a]}. ${q.o[q.a]}</span><br><span class="mu">${q.e||""}</span></div>`}).join("")||"<div class='card'>沒有錯題🎉</div>"};
  draw(false);document.getElementById("fa").onclick=()=>draw(false);document.getElementById("fw").onclick=()=>draw(true);
  const r=document.getElementById("rt");if(r)r.onclick=()=>start(R.log.filter(x=>!x.good).map(x=>x.id),true);
  document.getElementById("hm").onclick=home}
home();
</script></body></html>
