<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>炮製學限時挑戰</title>
<style>
:root{--bg:#F6F7F4;--card:#FFFFFF;--ink:#1B2226;--mute:#5B676D;--line:#D9DED9;--accent:#2E6F40;--ok:#17734A;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171A;--card:#1B2226;--ink:#E8ECEA;--mute:#98A5AB;--line:#2E3A40;--accent:#5DBA7D;--ok:#4CC38A;--bad:#FF7B72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171A;--card:#1B2226;--ink:#E8ECEA;--mute:#98A5AB;--line:#2E3A40;--accent:#5DBA7D;--ok:#4CC38A;--bad:#FF7B72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;line-height:1.3;margin:8px 0 6px}
h2{font-size:19px;margin:22px 0 8px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:#fff;font-weight:700;font-size:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1316}}
:root[data-theme="dark"] .btn{color:#0E1316}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent);margin-top:10px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mute)}
.hud b{color:var(--ink);font-size:18px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 10px;color:var(--mute)}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;min-height:48px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.big{font-size:52px;font-weight:800;line-height:1.1;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mute)}
.grid b{display:block;font-size:18px;color:var(--ink)}
.rv{border-left:5px solid var(--line);padding:6px 0 6px 12px;margin:14px 0}
.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}
.rv .r{font-size:14px}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--bad);font-weight:700}
.hide{display:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.seg button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 4px;font-weight:700;min-height:48px;font-size:14px}
.seg button[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>🌿 炮製學限時挑戰 (全九章)</h1>
  <div class="seg" id="seg" role="radiogroup" aria-label="選擇主題">
    <button role="radio" data-t="ch1" aria-checked="true">CH1<br>緒論</button>
    <button role="radio" data-t="ch2" aria-checked="false">CH2<br>療效</button>
    <button role="radio" data-t="ch3" aria-checked="false">CH3<br>目的</button>
    <button role="radio" data-t="ch4" aria-checked="false">CH4<br>分類</button>
    <button role="radio" data-t="ch5" aria-checked="false">CH5<br>品質</button>
    <button role="radio" data-t="ch6" aria-checked="false">CH6<br>淨選</button>
    <button role="radio" data-t="ch7" aria-checked="false">CH7<br>切製</button>
    <button role="radio" data-t="ch8" aria-checked="false">CH8<br>炒法</button>
    <button role="radio" data-t="ch9" aria-checked="false">CH9<br>炙法</button>
  </div>
  <p class="mute" id="scope"></p>
  <div class="card">
    <p><b>規則</b></p>
    <p id="rule">本系統共九章，每章收錄50題精選題庫。每輪抽取 15 題，每題 20 秒。答對得 100 分，再依剩餘時間加最多 100 分的速度分，滿分 3000 分。</p>
    <p>作答過程中不顯示對錯。全部答完後才看成績與解析，答錯的題目會自動排進重練。</p>
  </div>
  <p class="mute" id="best"></p>
  <button class="btn" id="start">開始挑戰</button>
</section>

<section id="play" class="hide">
  <div class="hud"><span id="prog">第 1 / 15 題</span><span>得分 <b id="sc">0</b></span><span><b id="tl">20</b> 秒</span></div>
  <div class="bar" role="progressbar" aria-label="剩餘時間"><i id="fill"></i></div>
  <span class="tag" id="cat"></span>
  <div class="q" id="q"></div>
  <div id="opts"></div>
</section>

<section id="end" class="hide">
  <h1 id="etitle">本輪成績</h1>
  <div class="big" id="esc"></div>
  <p class="mute" id="esub"></p>
  <div class="grid" id="stats"></div>
  <button class="btn" id="retry">重練錯題</button>
  <button class="btn alt" id="again">再來一輪新題目</button>
  <button class="btn alt" id="home2">回首頁換主題</button>
  <h2>逐題解析</h2>
  <div id="rev"></div>
</section>
</main>

  ch3: ["第三章 炮製目的", "範圍：降低毒性、改變藥性、增強療效、矯臭矯味及化學成分水解等變化。 (本章共50題)"],
  ch4: ["第四章 分類及輔料", "範圍：雷公十七法、三類法、五類法，以及酒醋蜜、滑石粉、蛤粉等輔料。 (本章共50題)"],
  ch5: ["第五章 品質與貯藏", "範圍：淨度、水分、灰分、浸出物，以及泛油、發霉、風化等變異與氣調貯藏。 (本章共50題)"],
  ch6: ["第六章 淨選與加工", "範圍：去蘆、去心、去皮殼、去毛(骨碎補/金櫻子)、去瓤(枳殼)、去核等。 (本章共50題)"],
  ch7: ["第七章 飲片切製", "範圍：淋潤、伏潤軟化，直片、斜片、頂刀片等片型原則，以及陰乾法等。 (本章共50題)"],
  ch8: ["第八章 炒法", "範圍：炒黃、炒焦、炒炭(槐花)，麩炒(蒼朮/枳殼)、米炒(斑蝥)、土炒、砂炒(馬錢子)等。 (本章共50題)"],
  ch9: ["第九章 炙法", "範圍：酒炙(大黃)、醋炙(延胡索)、薑炙(厚朴)、蜜炙(甘草)、鹽炙(杜仲)、油炙(淫羊藿)。 (本章共50題)"]
};

let PER = 20;
const sh = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const $ = id => document.getElementById(id);
const show = id => ["home", "play", "end"].forEach(s => $(s).classList.toggle("hide", s !== id));

let run = null, wrongBank = [], topic = "ch1";

const bk = () => "paozhi-ch-best-" + topic;
function getBest() {
  try { return +localStorage.getItem(bk()) || 0; } catch (e) { return 0; }
}
function bestTxt() {
  const b = getBest();
  $("best").textContent = b ? `${TOPICS[topic][0]}最高分：${b} 分` : "這個主題還沒有成績，先來一輪。";
}
function setTopic(t) {
  topic = t;
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.t === t)));
  $("scope").textContent = TOPICS[t][1];
  bestTxt();
}

bestTxt();

function pickRound() {
  return sh(QUESTIONS_DB[topic]).slice(0, 15);
}

function prep(q) {
  const idx = sh([0, 1, 2, 3]);
  return { ...q, opts: idx.map(i => q.o[i]), ans: idx.indexOf(q.a) };
}

function begin(list, isRetry) {
  PER = 20;
  run = { list: list.map(prep), i: 0, score: 0, log: [], retry: isRetry, t0: 0, timer: null, locked: false };
  show("play");
  ask();
}

function ask() {
  const q = run.list[run.i];
  run.locked = false;
  $("prog").textContent = `第 ${run.i + 1} / ${run.list.length} 題`;
  $("sc").textContent = run.score;
  $("cat").textContent = q.c;
  $("q").textContent = q.q;
  const box = $("opts");
  box.innerHTML = "";
  q.opts.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = t;
    b.onclick = () => pick(i, b);
    box.appendChild(b);
  });
  run.t0 = performance.now();
  clearInterval(run.timer);
  tick();
  run.timer = setInterval(tick, 100);
}

function left() {
  return Math.max(0, PER - (performance.now() - run.t0) / 1000);
}

function tick() {
  const l = left();
  $("tl").textContent = Math.ceil(l);
  $("fill").style.transform = `scaleX(${l / PER})`;
  $("fill").style.background = l > 10 ? "var(--ok)" : l > 5 ? "#F0A04B" : "var(--bad)";
  if (l <= 0) finish(null);
}

function pick(i, b) {
  if (run.locked) return;
  b.classList.add("sel");
  finish(i);
}

function finish(choice) {
  if (run.locked) return;
  run.locked = true;
  clearInterval(run.timer);
  const q = run.list[run.i], l = left(), ok = choice === q.ans;
  const pts = ok ? 100 + Math.round(l / PER * 100) : 0;
  run.score += pts;
  run.log.push({ q, choice, ok, pts });
  $("sc").textContent = run.score;
  setTimeout(() => {
    run.i++;
    run.i < run.list.length ? ask() : results();
  }, choice === null ? 150 : 250);
}

function results() {
  const L = run.log, right = L.filter(x => x.ok).length, max = L.length * 200;
  wrongBank = L.filter(x => !x.ok).map(x => x.q);
  if (!run.retry && run.score > getBest()) {
    try { localStorage.setItem(bk(), run.score); } catch (e) {}
  }
  $("etitle").textContent = run.retry ? "重練成績" : "本輪成績";
  $("esc").textContent = `${run.score} 分`;
  $("esub").textContent = run.retry ? `重練 ${L.length} 題，答對 ${right} 題。` : `滿分 ${max} 分，答對 ${right} / ${L.length} 題。`;
  
  const cats = [...new Set(L.map(x => x.q.c))];
  $("stats").innerHTML = cats.map(c => {
    const a = L.filter(x => x.q.c === c);
    return `<div>${c}<b>${a.length ? a.filter(x => x.ok).length + " / " + a.length : "–"}</b></div>`;
  }).join("");
  
  const rb = $("retry");
  rb.classList.toggle("hide", !wrongBank.length);
  rb.textContent = `重練錯題（${wrongBank.length} 題）`;
  
  $("rev").innerHTML = "";
  L.forEach((x, n) => {
    const d = document.createElement("div");
    d.className = "rv " + (x.ok ? "ok" : "no");
    const mine = x.choice === null ? "（逾時未作答）" : x.q.opts[x.choice];
    d.innerHTML = `<div class="r"><span class="${x.ok ? "ok-t" : "no-t"}">${x.ok ? "答對" : "答錯"}</span>　第 ${n + 1} 題・${x.q.c}・${x.pts} 分</div><div><b></b></div><div class="r"></div><div class="r"></div><div class="r mute" style="margin-top:4px;"></div>`;
    const k = d.children;
    k[1].firstChild.textContent = x.q.q;
    k[2].textContent = "你的答案：" + mine;
    k[3].textContent = "正確答案：" + x.q.opts[x.q.ans];
    k[4].textContent = x.q.e;
    if (x.ok) k[2].textContent = "你的答案：" + mine + "（正確）";
    $("rev").appendChild(d);
  });
  
  bestTxt();
  show("end");
  window.scrollTo(0, 0);
}

$("start").onclick = () => begin(pickRound(), false);
$("again").onclick = () => begin(pickRound(), false);
$("retry").onclick = () => begin(sh(wrongBank), true);
$("home2").onclick = () => show("home");
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => setTopic(b.dataset.t));
setTopic("ch1");
</script>
</body>
</html>
